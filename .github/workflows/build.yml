
name: Build C.AI Add-blocker

on:
  workflow_dispatch:
  push:
    paths:
      - 'C.AI-Add-blocker-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -o C.AI-Add-blocker-source.zip

      - name: Build APK
        run: gradle --no-daemon -p C.AI-Add-blocker :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: C-AI-Add-blocker-APK
          path: C.AI-Add-blocker/app/build/outputs/apk/debug/*.apk
